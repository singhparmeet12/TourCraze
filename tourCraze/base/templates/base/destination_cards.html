<!-- Trending Destination Cards (30 Brand-New Unique Places) -->
{% if trending_destinations %}
    {% for item in trending_destinations %}
    <a href="{% url 'plan_trip' %}?destination={{ item.name|urlencode }}&days={{ item.days }}&budget={{ item.budget_num }}&style={{ item.style }}&auto=1" 
       class="destination-card-link text-decoration-none"
       title="Click to view full day-by-day itinerary for {{ item.name }}"
       style="display: block; flex: 0 0 300px; width: 300px; min-width: 300px; max-width: 300px; height: 450px; flex-shrink: 0; text-decoration: none; cursor: pointer;">
        <div class="destination-card" style="position: relative; width: 300px; height: 450px; border-radius: 18px; overflow: hidden; box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.12); background-color: #1e293b; transition: transform 0.3s ease, box-shadow 0.3s ease;">
            <img src="{{ item.img }}" alt="{{ item.name }}" loading="lazy"
                 style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block;">
            <div class="card-content" style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(180deg, transparent 0%, rgba(12, 17, 31, 0.8) 40%, rgba(12, 17, 31, 0.98) 100%); color: white;">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <h4 class="mb-0 text-white fw-bold" style="font-size: 1.25rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">{{ item.name }}</h4>
                    <span class="rating-badge" style="background-color: #F8C922; color: #212529; padding: 3px 8px; border-radius: 12px; font-size: 0.82rem; font-weight: 700;">
                        <i class="fas fa-star text-dark"></i> {{ item.rating }}
                    </span>
                </div>
                {% if item.state %}
                <p class="text-warning small mb-1 fw-semibold" style="font-size: 0.85rem;"><i class="fas fa-map-pin me-1"></i>{{ item.state }}</p>
                {% endif %}
                <div class="d-flex justify-content-between text-light small mt-2 pt-2" style="border-top: 1px solid rgba(255, 255, 255, 0.15); font-size: 0.82rem;">
                    <span><i class="fas fa-calendar-alt text-warning me-1"></i>{{ item.season }}</span>
                    <span class="text-white fw-bold">{{ item.budget }}</span>
                </div>
            </div>
        </div>
    </a>
    {% endfor %}
{% endif %}
