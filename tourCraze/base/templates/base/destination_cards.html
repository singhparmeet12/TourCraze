<!-- Trending Destination Cards (30 Brand-New Unique Places) -->
{% if trending_destinations %}
    {% for item in trending_destinations %}
    <a href="{% url 'plan_trip' %}?destination={{ item.name|urlencode }}&days={{ item.days }}&budget={{ item.budget_num }}&style={{ item.style }}&auto=1" 
       class="destination-card-link text-decoration-none"
       title="Click to view full day-by-day itinerary for {{ item.name }}">
        <div class="destination-card">
            <img src="{{ item.img }}" alt="{{ item.name }}" loading="lazy" class="dest-card-img">
            <div class="card-content">
                <div class="d-flex justify-content-between align-items-center mb-1 gap-1">
                    <h4 class="mb-0 text-white fw-bold dest-card-title text-truncate">{{ item.name }}</h4>
                    <span class="rating-badge flex-shrink-0">
                        <i class="fas fa-star text-dark"></i> {{ item.rating }}
                    </span>
                </div>
                {% if item.state %}
                <p class="text-warning dest-card-state mb-1 fw-semibold text-truncate"><i class="fas fa-map-pin me-1"></i>{{ item.state }}</p>
                {% endif %}
                <div class="d-flex justify-content-between text-light dest-card-footer mt-2 pt-1">
                    <span class="text-truncate me-1"><i class="fas fa-calendar-alt text-warning me-1"></i>{{ item.season }}</span>
                    <span class="text-white fw-bold flex-shrink-0">{{ item.budget }}</span>
                </div>
            </div>
        </div>
    </a>
    {% endfor %}
{% endif %}
