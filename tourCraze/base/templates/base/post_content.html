{% extends 'main.html' %}
{% load static %}

{% block styles %}
    <link rel="stylesheet" type="text/css" href="{% static 'styles/post.css' %}">
{% endblock %}

{% block content %}
    <h2>Post Your Content Here</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    

<div class="post-content">
    
    <div class="form-group">
        <label for="id_content">Content</label>
        {{ form.content }}
    </div>

    <div class="form-group">
        <label for="id_image">Upload Image</label>
        {{ form.image }}
    </div>

    <button type="submit" class="btn btn-primary custom-submit-btn">Submit</button>
</form>
</div>
    
{% endblock %}
